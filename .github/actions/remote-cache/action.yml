---
# Points the job's Bazel at the bazel-r2-cache remote cache. Every Bazel
# repository's CI uses this action, pinned by commit, so the setup lives in
# one place. The action takes both tokens and picks one by the event: the
# main token on a push to main or in a merge queue run, the org's PR token
# on a pull request, and no cache for anything else. The token goes to a
# mode-600 file that a credential helper reads, so it never appears in a
# flag or the build's logs. An empty chosen token, as a fork's pull request
# gets, leaves the cache off.
name: Use the bazel-r2-cache remote cache
description: Configure Bazel to read and write the bazel-r2-cache remote cache.

inputs:
  main-token:
    description: >-
      The repository's main token, used on a push to main and in a merge
      queue run. Pass an empty value where the job can't read it.
    required: false
    default: ""
  pr-token:
    description: >-
      The org's PR token, used on a pull request. Its entries go to the pull
      request's own namespace.
    required: false
    default: ""
  remote-timeout:
    description: >-
      Seconds Bazel waits on one remote cache call, as a whole number. The
      preset's `ci` config sets 3600, which let one stalled request hold a
      build for about 23 minutes.
    required: false
    default: "120"
  remote-retries:
    description: >-
      How many times Bazel retries a failed remote cache call, as a whole
      number.
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: Use the remote cache
      shell: bash
      env:
        # The expressions pick the token before the shell starts, so a token
        # the event doesn't use never reaches it. The main token is bound to
        # this repository's main namespace on the Worker and goes with no
        # pull request header; the PR token goes with one. An expression
        # compares text without case, so the shell checks a push's ref
        # exactly and drops the token for any branch but `main`.
        TOKEN: >-
          ${{
            (github.event_name == 'merge_group' || github.event_name == 'push')
            && inputs.main-token
            || github.event_name == 'pull_request' && inputs.pr-token
            || ''
          }}
        PULL_REQUEST_HEADER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        REMOTE_TIMEOUT: ${{ inputs.remote-timeout }}
        REMOTE_RETRIES: ${{ inputs.remote-retries }}
      run: |
        if [[ ! "${REMOTE_TIMEOUT}" =~ ^[0-9]+$ || ! "${REMOTE_RETRIES}" =~ ^[0-9]+$ ]]; then
          echo "::error::remote-timeout and remote-retries must be whole numbers"
          exit 1
        fi
        if [[ "${EVENT}" == "push" && "${REF}" != "refs/heads/main" ]]; then
          TOKEN=""
        fi
        if [[ -z "${TOKEN}" ]]; then
          echo "::notice::no cache token for this ${EVENT} run; building without the remote cache"
          exit 0
        fi
        dir="${RUNNER_TEMP}/bazel-cache"
        mkdir -p "${dir}"
        chmod 700 "${dir}"
        (umask 077 && printf '%s' "${TOKEN}" > "${dir}/token")
        cat > "${dir}/credential-helper" <<'HELPER'
        #!/bin/sh
        cat >/dev/null
        printf '{"headers":{"Authorization":["Bearer %s"]}}\n' "$(cat "$(dirname "$0")/token")"
        HELPER
        chmod 700 "${dir}/credential-helper"
        {
          # An existing ~/.bazelrc may end without a newline; start a new line
          # so the first flag does not fuse onto its last one.
          echo
          echo "common --remote_cache=https://bazel-cache.tbhb.dev"
          echo "common --credential_helper=bazel-cache.tbhb.dev=${dir}/credential-helper"
          # The preset's `common:ci --remote_timeout=3600` expands from
          # --config=ci, after plain `common` lines, so only a `common:ci`
          # line in this later-read file overrides it.
          echo "common:ci --remote_timeout=${REMOTE_TIMEOUT}"
          echo "common:ci --remote_retries=${REMOTE_RETRIES}"
          if [[ -n "${PULL_REQUEST_HEADER}" ]]; then
            echo "common --remote_header=Bazel-Cache-Pull-Request=${GITHUB_REPOSITORY}/${PULL_REQUEST_HEADER}"
          fi
        } >> "${HOME}/.bazelrc"
