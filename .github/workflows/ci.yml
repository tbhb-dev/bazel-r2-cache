---
# Main quality gate. Bazel pins the tools and owns the gates: the hermetic
# checks are cached `bazel test` targets, so `bazel test //...` runs them
# all, and the few that need the network, Git history or the GitHub API run
# as their own steps after it. A final `conclusion` job gives branch
# protection one stable required check.
name: ci

# On main, the deploy workflow runs these same jobs before it deploys,
# rather than reacting to this workflow's result. A push to main also runs
# this workflow on its own, only to fill the shared remote cache: a job in
# a reusable workflow doesn't get its environment's secrets, so the run
# that deploy calls builds without the main token.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Bazel 9.x only, the version .bazelversion pins, on Linux alone: the
  # Worker runs on Cloudflare's Linux-based runtime, so no other OS adds
  # coverage. The checks that need the network or GitHub's API run in the
  # repo job.
  bazel:
    name: bazel
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # The push to main run (not the one deploy calls, which has
    # `github.workflow` set to the caller's name) writes the shared action
    # cache with the main token, a secret of the main-only `cache`
    # environment that no pull request can read. Pull requests use the
    # org's PR token, which writes only their own namespace.
    environment: ${{ github.event_name == 'push' && github.workflow == 'ci' && 'cache' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The shared setup hardens the runner, sets up Bazel with the bazelisk
      # and repository caches, and fetches //..., retrying transient
      # failures. The run that fills the shared remote cache skips the disk
      # cache: Bazel uploads only the results it runs, never a disk cache
      # hit, so that run runs every action.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@2115a5f30f371e7955612cf1f0c31bd7e81633f9  # main
        with:
          disk-cache: ${{ (github.event_name == 'push' && github.workflow == 'ci') && 'false' || 'ci' }}
          cache-save: ${{ github.event_name != 'pull_request' }}

      # The bazel-r2-cache remote cache, through its shared action. A fork's
      # pull request gets no secrets and builds without the cache.
      - name: Use the remote cache
        uses: ./.github/actions/remote-cache
        with:
          token: ${{ github.event_name == 'push' && secrets.BAZEL_CACHE_TOKEN || secrets.BAZEL_CACHE_PR_TOKEN }}
          pull-request: ${{ github.event.pull_request.number }}

      # //... covers the @tbhb_rules lint, format, shell and docs tests over
      # the whole tree, the buildifier_test, and the preset.update_test that
      # fails when preset.bazelrc is stale.
      - name: Test
        run: bazelisk test --config=ci //...

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs
          path: |
            .bazel-testlogs/**/test.log
            .bazel-testlogs/**/test.xml
          include-hidden-files: true
          if-no-files-found: ignore

  # Fills the shared cache for macOS hosts: cache keys include the
  # platform, so the Linux job's entries never hit on a Mac. It runs only in
  # the push to main run that writes the cache, and no gate needs it.
  # Standard macOS runners are free for public repositories.
  cache-macos:
    name: cache-macos
    if: github.event_name == 'push' && github.workflow == 'ci'
    runs-on: macos-15
    timeout-minutes: 30
    environment: cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No disk cache: Bazel uploads only the results it runs.
      - name: Set up Bazel for CI
        uses: tbhb-dev/rules/.github/actions/setup-bazel-ci@2115a5f30f371e7955612cf1f0c31bd7e81633f9  # main
        with:
          disk-cache: false

      - name: Use the remote cache
        uses: ./.github/actions/remote-cache
        with:
          token: ${{ secrets.BAZEL_CACHE_TOKEN }}

      - name: Test
        run: bazelisk test --config=ci //...

  # The repository-level checks, beside the bazel job, so they don't wait
  # behind the tests: MODULE.bazel tidiness, the Git history scan, zizmor's
  # online audits and the CODEOWNERS API check. There is no Python to audit.
  repo:
    name: repo
    permissions:
      contents: read
    uses: tbhb-dev/rules/.github/workflows/repo-checks.yml@2115a5f30f371e7955612cf1f0c31bd7e81633f9  # main
    with:
      module-dirs: .
      pip-audit-target: ""

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed. It passes only when every needed job's
  # result is exactly "success", so a gate that was skipped, cancelled or
  # never finished cannot pass.
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job did not succeed
        uses: tbhb-dev/rules/.github/actions/ci-conclusion@2115a5f30f371e7955612cf1f0c31bd7e81633f9  # main
        with:
          needs: ${{ toJSON(needs) }}
